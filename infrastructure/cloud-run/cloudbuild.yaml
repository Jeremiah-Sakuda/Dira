# Cloud Build config for one Dira service image.
#   gcloud builds submit --config infrastructure/cloud-run/cloudbuild.yaml \
#     --substitutions _SERVICE=orchestrator,_REGION=us-central1 .
substitutions:
  _SERVICE: orchestrator
  _REGION: us-central1
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infrastructure/cloud-run/Dockerfile
      - --build-arg
      - SERVICE=${_SERVICE}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/dira/dira-${_SERVICE}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/dira/dira-${_SERVICE}
